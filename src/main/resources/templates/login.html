<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign in')}"></head>
<body class="centered">

<main class="wrap narrow">
  <div class="card login-card">

    <!--
      PHLPost leads, PIVOT identifies the system beneath it. The institution is the authority
      here; the toolkit is only how staff reach it.
    -->
    <div class="login-brand">
      <img th:if="${govMarkAvailable}" class="login-gov"
           th:src="@{/img/bagong-pilipinas-mark.png}" alt="Bagong Pilipinas">
      <img th:if="${brandLogoAvailable}" class="login-logo"
           th:src="@{/img/phlpost-logo.png}" alt="PHLPost">
      <span th:unless="${brandLogoAvailable}" class="login-wordmark">PHLPost</span>
    </div>

    <h1 class="app-name">PIVOT</h1>
    <p class="app-expansion">PHLPost Identity Verification &amp; Onboarding Toolkit</p>

    <p class="lede">Sign in to run a verification.</p>

    <!-- Deliberately vague: naming which of the two was wrong helps an attacker enumerate users. -->
    <div class="alert alert-error" th:if="${param.error}" role="alert">
      Incorrect username or password.
    </div>
    <div class="alert alert-warn" th:if="${param.throttled}" role="alert">
      Too many sign-in attempts. Wait a few minutes before trying again.
    </div>
    <div class="alert alert-info" th:if="${param.loggedOut}" role="status">
      You have been signed out.
    </div>

    <form th:action="@{/login}" method="post" class="form">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <div class="actions">
        <button type="submit" class="btn btn-primary">Sign in</button>
      </div>
    </form>
  </div>
</main>

</body>
</html>
