spring:
  application:
    name: postal-id-verification

  datasource:
    # File-based H2. Portable ANSI SQL migrations mean switching to PostgreSQL is a datasource
    # change plus the driver dependency; see application-postgres.yml.
    # AUTO_SERVER lets a second process (an external SQL client) attach while the app is running.
    # H2 rejects it alongside DB_CLOSE_ON_EXIT, so that one is left at its default.
    url: jdbc:h2:file:./data/postalid;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: ${POSTALID_DB_USERNAME:sa}
    password: ${POSTALID_DB_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only validates that the mapping agrees with it, so a
      # drifted entity fails at startup instead of silently reading the wrong column.
      ddl-auto: validate
    # Deliberately no hibernate.jdbc.time_zone here. That setting rewrites temporal values on the
    # way to the driver, which is right for an Instant but wrong for the capture-station wall
    # clocks in card_status_history: those are LocalDateTime precisely because they carry no zone,
    # and converting them shifted every one by the server's UTC offset. Instants round-trip
    # symmetrically through the JVM zone instead, so run the JVM in UTC (-Duser.timezone=UTC) to
    # keep stored instants unambiguous.

  flyway:
    enabled: true
    # db/migration holds the portable migrations. The OAuth schema's column types are not
    # portable, so its two flavours live under db/vendor, outside the recursive scan of
    # db/migration — Flyway would otherwise find both copies of V5 and refuse to start.
    locations: classpath:db/migration,classpath:db/vendor/{vendor}

  threads:
    virtual:
      enabled: true

  lifecycle:
    # Upper bound on graceful shutdown; past this, remaining requests are dropped rather than
    # holding the process open through a deploy.
    timeout-per-shutdown-phase: 25s

server:
  port: ${SERVER_PORT:8443}
  ssl:
    enabled: ${POSTALID_SSL_ENABLED:true}
    key-store: ${POSTALID_SSL_KEYSTORE:classpath:keystore/postalid-dev.p12}
    key-store-type: PKCS12
    key-store-password: ${POSTALID_SSL_KEYSTORE_PASSWORD:}
    key-alias: ${POSTALID_SSL_KEY_ALIAS:postalid}
  # Finish in-flight verifications before exiting, so a redeploy does not cut an operator off
  # mid-check or lose the audit row for an attempt that already happened.
  shutdown: graceful

  # Caps on what a single request may cost. Without these one caller can hold a connection open
  # indefinitely or post an arbitrarily large body, both of which are cheap denial of service.
  tomcat:
    connection-timeout: 20s
    keep-alive-timeout: 15s
    max-http-form-post-size: 64KB
    max-swallow-size: 64KB
    max-connections: ${POSTALID_MAX_CONNECTIONS:8192}
    threads:
      max: ${POSTALID_MAX_THREADS:200}
  max-http-request-header-size: 16KB

  error:
    # An error page that quotes the exception is an information leak.
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: strict
      timeout: 30m

management:
  endpoints:
    web:
      exposure:
        # Health only. Everything else about a service holding personal data stays shut.
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      # Anonymous callers still see nothing but UP/DOWN. An authenticated operator sees which
      # component is unhealthy, which is the difference between a useful probe and a shrug.
      show-details: when-authorized
      show-components: when-authorized
      roles: OPERATOR
      group:
        # Readiness gates traffic, so it covers everything an answer depends on. Without
        # blobStore here an instance whose storage vanished keeps taking requests and returns
        # VALID results whose images all 404.
        readiness:
          include: readinessState,db,blobStore
        # Liveness answers only "would a restart help". A storage outage or a database outage
        # would not be fixed by one, and failing liveness on those produces a crash loop.
        liveness:
          include: livenessState
  health:
    # A verification is answerable only if the database is reachable and the photographs are
    # readable, so both gate readiness. Liveness stays narrow on purpose: restarting the process
    # will not remount a filesystem, and a liveness probe that fails on a storage outage just
    # produces a crash loop.
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    root: INFO
    com.postalid.verification: INFO
    # Logs SQL statements, not parameters; parameter logging would print names and reference
    # numbers straight into the log file.
    org.hibernate.SQL: WARN

postalid:
  verify:
    # A record must have reached one of these before it counts as an issued card.
    issued-statuses:
      - CDE
    allow-middle-initial: true
    allow-middle-name-omission: false
    # No expiry column exists in the enrollment export, so validity is derived: the card
    # production date plus this period. Responses flag it derived:true for that reason.
    # Confirm the real rule with the data owner before consumers depend on it.
    validity-period: P3Y
    # An expired card still verifies by default, reported as validity.status = EXPIRED.
    # The identity checked out; that is a different fact from the card being current.
    treat-expired-as-invalid: false

  media:
    token-ttl: 5m
    token-max-uses: 5
    max-image-pixels: 40000000

  storage:
    # Holds extracted personal data; keep outside the repository and back it up accordingly.
    root: ${POSTALID_STORAGE_ROOT:./data/blobstore}

  ingest:
    source-dir: ${POSTALID_INGEST_DIR:./files}
    fail-fast: false

  limits:
    # A verification body is five short fields. Anything larger is a mistake or an attack, and
    # is refused on Content-Length before the body is read.
    max-request-bytes: 16384

  rate-limit:
    enabled: true
    verify-per-client-per-minute: 300
    verify-per-ip-per-minute: 100
    image-per-client-per-minute: 600
    invalid-burst-threshold: 20
    invalid-lookback: 10m
    invalid-penalty: 5m

  audit:
    # Startup fails while this is unset or left at the placeholder.
    prn-hash-pepper: ${POSTALID_AUDIT_PRN_HASH_PEPPER:CHANGE-ME}

  oauth:
    access-token-ttl: 5m
    audience: postal-id-verification-api
    issuer: ${POSTALID_ISSUER:}
    jwk:
      keystore-location: ${POSTALID_JWT_KEYSTORE:}
      keystore-password: ${POSTALID_JWT_KEYSTORE_PASSWORD:}
      key-alias: ${POSTALID_JWT_KEY_ALIAS:postalid-jwt}
    # Declare clients per environment. Secrets come from the environment, never from a
    # committed file.
    clients: {}

  web:
    operators: {}
