# Test profile.
#
# In-memory database, no TLS, and an ephemeral JWT key. The credentials here are test fixtures
# and exist only for the duration of a build.

spring:
  datasource:
    url: jdbc:h2:mem:postalid-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/vendor/{vendor}

  thymeleaf:
    cache: false

server:
  ssl:
    enabled: false

logging:
  level:
    org.springframework.security: WARN
    com.postalid.verification: INFO

postalid:
  storage:
    root: ./target/test-blobstore

  audit:
    prn-hash-pepper: test-pepper-value-not-a-secret

  media:
    token-ttl: 5m
    token-max-uses: 5

  rate-limit:
    # Off by default so functional tests are not fighting a budget. The rate-limit test turns it
    # back on for itself.
    enabled: false

  oauth:
    issuer: http://localhost
    access-token-ttl: 5m
    clients:
      test-client:
        name: Full-scope test client
        secret: test-client-secret
        scopes:
          - postalid.verify
          - postalid.images
          - postalid.diagnostics
      verify-only-client:
        name: Verify-only test client
        secret: verify-only-secret
        scopes:
          - postalid.verify

  web:
    operators:
      test-operator:
        password: test-operator-password
